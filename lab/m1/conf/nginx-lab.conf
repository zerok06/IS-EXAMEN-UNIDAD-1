# nginx · terminador TLS para *.uni.lab → Apache prefork (mod_php)
# nginx NO ejecuta PHP: solo cifra, limita y proxya a 127.0.0.1:8080.

upstream lab_httpd {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.uni.lab wp.uni.lab moodle.uni.lab;

    ssl_certificate     /etc/nginx/tls/app-chain.crt;
    ssl_certificate_key /etc/nginx/tls/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # El PoC envía cuerpos de 12–21 MB (OOM). nginx debe dejarlos pasar.
    client_max_body_size 64m;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # Sin buffering: el leak llega en Set-Cookie mientras el worker muere.
    proxy_request_buffering off;
    proxy_buffering         off;

    location / {
        proxy_pass         http://lab_httpd;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}
