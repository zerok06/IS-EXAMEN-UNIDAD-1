# httpd.conf · Apache 2.4.49 prefork + mod_php 8.4.26 (NTS)
# Escucha SOLO en loopback: nginx termina TLS en 443.

ServerRoot "/usr/local/apache2"
PidFile logs/httpd.pid
Listen 127.0.0.1:8080

ServerName app.uni.lab
ServerTokens Full
ServerSignature Off
User www-data
Group www-data

Timeout 300
KeepAlive Off
MaxRequestWorkers 4
ServerLimit 4
LimitRequestBody 0
LimitRequestLine 8190
LimitRequestFieldSize 8190
LimitRequestFields 100

# --- MPM prefork (estático: no se carga como módulo) ---
# 4 hijos: la subida lenta del PoC ocupa uno y el LFI necesita otro libre.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          4
    MaxRequestWorkers        4
    ServerLimit              4
    MaxConnectionsPerChild   0
</IfModule>

# --- módulos ---
LoadModule unixd_module       modules/mod_unixd.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule authz_host_module  modules/mod_authz_host.so
LoadModule mime_module        modules/mod_mime.so
LoadModule dir_module         modules/mod_dir.so
LoadModule log_config_module  modules/mod_log_config.so
LoadModule env_module         modules/mod_env.so
LoadModule setenvif_module    modules/mod_setenvif.so
LoadModule headers_module     modules/mod_headers.so
LoadModule rewrite_module     modules/mod_rewrite.so
LoadModule cgi_module         modules/mod_cgi.so
LoadModule php_module         modules/libphp.so

AddType application/x-httpd-php .php
DirectoryIndex index.php index.html

ErrorLog  logs/error_log
LogLevel  warn
LogFormat "%h %l %u %t \"%r\" %>s %b pid=%{pid}P dur=%D" lab
CustomLog logs/access_log lab

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>

DocumentRoot "/var/www/wp"
<VirtualHost *:8080>
    ServerName app.uni.lab
    DocumentRoot "/var/www/app"
    <Directory "/var/www/app">
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8080>
    ServerName wp.uni.lab
    DocumentRoot "/var/www/wp"
    <Directory "/var/www/wp">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
    # Perfil de entry-a (PoC): memoria baja y cuerpo grande permitido.
    <Directory "/var/www/wp/lab/poc">
        AllowOverride None
        Options -Indexes
        Require all granted
        php_admin_value memory_limit 8M
        php_admin_value post_max_size 32M
        php_admin_value max_input_vars 6000
        php_admin_flag  display_errors On
        php_admin_flag  session.upload_progress.enabled On
        php_admin_value session.upload_progress.cleanup Off
    </Directory>
</VirtualHost>

<VirtualHost *:8080>
    ServerName moodle.uni.lab
    DocumentRoot "/var/www/moodle"
    <Directory "/var/www/moodle">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>

<IfModule mod_headers_module>
    Header always set X-Powered-By "PHP/8.4.26"
</IfModule>
