---
# play-m3-backup.yml · Estudiante 3, desde su laptop:
#   ansible-playbook -i inventories/m3.ini play-m3-backup.yml
# Deja: NFS + Samba 4.5.10 + vsftpd 2.3.4 + backups con secreto + vulns B1-B4.
- name: M3 respaldos
  hosts: m3
  become: yes
  vars:
    samba_ver: "4.5.10"
    url_samba: "https://download.samba.org/pub/samba/stable/samba-{{ samba_ver }}.tar.gz"
    url_vsftpd: "https://security.appspot.com/downloads/vsftpd-2.3.4.tar.gz"
    src: /usr/local/src/lab
    clave_comun: CAMBIAR_clave_comun_M4_M5   # MISMA que M4 Administrator y M5 (paso 5)
    m1_ip: 10.10.10.11
    m2_ip: 10.10.10.12

  tasks:
    - name: Paquetes base
      apt:
        update_cache: yes
        name:
          - build-essential
          - nfs-kernel-server
          - openssh-server
          - libgnutls28-dev
          - libpopt-dev
          - libldap2-dev
          - libpam0g-dev
          - python3-dev
          - ufw
        state: present

    - name: Directorios de storage
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /srv/storage/wp-uploads
        - /srv/storage/moodledata
        - /srv/storage/backups

    - name: NFS solo para M1 + trampa B4
      copy:
        dest: /etc/exports
        content: |
          /srv/storage/wp-uploads  {{ m1_ip }}(rw,sync,no_subtree_check)
          /srv/storage/moodledata  {{ m1_ip }}(rw,sync,no_subtree_check)
          /srv/storage/backups     10.10.10.0/24(rw,sync,no_subtree_check,no_root_squash)
      notify: Recargar NFS
    - name: Servicio NFS activo
      service:
        name: nfs-kernel-server
        state: started
        enabled: yes

    - name: Compilar Samba 4.5.10 (B1)
      shell: |
        set -e
        mkdir -p {{ src }} && cd {{ src }}
        if [ ! -f samba-{{ samba_ver }}.tar.gz ]; then
          wget -q {{ url_samba }}
        fi
        rm -rf samba-{{ samba_ver }}
        tar xzf samba-{{ samba_ver }}.tar.gz
        cd samba-{{ samba_ver }}
        ./configure --without-ad-dc --prefix=/usr/local/samba
        make -j$(nproc)
        make install
      args:
        creates: /usr/local/samba/sbin/smbd
    - name: smb.conf con invitados (B1/B3 intencional)
      copy:
        dest: /usr/local/samba/etc/smb.conf
        content: |
          [global]
            workgroup = UNI
            server string = Storage LAB
            security = user
            map to guest = Bad User
            guest ok = no
          [backups]
            path = /srv/storage/backups
            read only = no
            guest ok = yes
            create mask = 0644
    - name: smbd como servicio systemd
      copy:
        dest: /etc/systemd/system/smbd-lab.service
        content: |
          [Unit]
          Description=Samba 4.5.10 laboratorio
          After=network.target
          [Service]
          Type=forking
          ExecStart=/usr/local/samba/sbin/smbd -D
          [Install]
          WantedBy=multi-user.target
    - name: Habilitar y arrancar smbd
      systemd:
        name: smbd-lab
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Compilar vsftpd 2.3.4 (B2)
      shell: |
        set -e
        mkdir -p {{ src }} && cd {{ src }}
        if [ ! -f vsftpd-2.3.4.tar.gz ]; then
          wget -q {{ url_vsftpd }}
        fi
        rm -rf vsftpd-2.3.4
        tar xzf vsftpd-2.3.4.tar.gz
        cd vsftpd-2.3.4
        make
        cp vsftpd /usr/local/sbin/vsftpd
      args:
        creates: /usr/local/sbin/vsftpd
    - name: vsftpd con anonimo + escritura (B2/B3 intencional)
      copy:
        dest: /etc/vsftpd.conf
        content: |
          listen=YES
          anonymous_enable=YES
          anon_upload_enable=YES
          write_enable=YES
          anon_root=/srv/storage
          dirmessage_enable=YES
          xferlog_enable=YES
    - name: vsftpd como servicio systemd
      copy:
        dest: /etc/systemd/system/vsftpd-lab.service
        content: |
          [Unit]
          Description=vsftpd 2.3.4 laboratorio
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/vsftpd /etc/vsftpd.conf
          Restart=always
          [Install]
          WantedBy=multi-user.target
    - name: Habilitar y arrancar vsftpd
      systemd:
        name: vsftpd-lab
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Usuario backup receptor de M2
      user:
        name: backup
        shell: /bin/bash
        create_home: yes
        state: present
    - name: Secreto intencional para la cadena (B3)
      copy:
        dest: /srv/storage/backups/credenciales.txt
        mode: "0644"
        content: |
          # SOLO LABORATORIO - intencional para el paso 3
          admin M4/M5: {{ clave_comun }}
          NOTA: misma clave que Administrator de M4 y Administrador de M5.

    - name: UFW NFS solo M1 + superficie intencional
      ufw:
        rule: allow
        port: "2049"
        proto: tcp
        from_ip: "{{ m1_ip }}"
    - name: UFW SMB/FTP abiertos + SSH desde M2
      ufw:
        rule: allow
        port: "{{ item }}"
      loop: ["445", "139", "21"]
    - name: UFW SSH desde M2
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ m2_ip }}"

    - name: Verificar servicios
      shell: |
        exportfs -v
        /usr/local/samba/sbin/smbd --version 2>/dev/null || /usr/local/samba/bin/smbstatus --version 2>/dev/null || echo "smbd 4.5.10 instalado"
        ls -l /srv/storage/backups/credenciales.txt
        ss -tln | grep -E '2049|445|21' || true
      register: verif
      changed_when: false
    - name: Mostrar verificacion
      debug:
        var: verif.stdout_lines

  handlers:
    - name: Recargar NFS
      shell: exportfs -ra
