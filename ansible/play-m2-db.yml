---
# play-m2-db.yml · Estudiante 2, desde su laptop:
#   ansible-playbook -i inventories/m2.ini play-m2-db.yml
# Deja: MariaDB (wp_db, moodle_db) + Redis 6.2.6 sin auth + SNMP public/private + vulns D1-D4.
- name: M2 base de datos
  hosts: m2
  become: yes
  vars:
    redis_ver: "6.2.6"
    url_redis: "https://download.redis.io/releases/redis-{{ redis_ver }}.tar.gz"
    src: /usr/local/src/lab
    clave_debil: CAMBIAR_clave_db
    m1_ip: 10.10.10.11

  tasks:
    - name: Paquetes base
      apt:
        update_cache: yes
        name:
          - build-essential
          - tcl
          - mariadb-server
          - mariadb-client
          - snmpd
          - ufw
          - cron
        state: present

    - name: MariaDB escuchando en la LAN
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 10.10.10.12'
      notify: Reiniciar MariaDB
    - name: Servicio MariaDB activo
      service:
        name: mariadb
        state: started
        enabled: yes

    - name: Bases y usuarios debiles (D2 intencional)
      shell: |
        mariadb -e "CREATE DATABASE IF NOT EXISTS wp_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        mariadb -e "CREATE DATABASE IF NOT EXISTS moodle_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        mariadb -e "CREATE USER IF NOT EXISTS 'wp_user'@'{{ m1_ip }}' IDENTIFIED BY '{{ clave_debil }}';"
        mariadb -e "CREATE USER IF NOT EXISTS 'moodle_user'@'{{ m1_ip }}' IDENTIFIED BY '{{ clave_debil }}';"
        mariadb -e "GRANT ALL ON wp_db.* TO 'wp_user'@'{{ m1_ip }}';"
        mariadb -e "GRANT ALL ON moodle_db.* TO 'moodle_user'@'{{ m1_ip }}';"
        mariadb -e "FLUSH PRIVILEGES;"
      changed_when: false

    - name: Compilar Redis 6.2.6 (D1)
      shell: |
        set -e
        mkdir -p {{ src }} && cd {{ src }}
        if [ ! -f redis-{{ redis_ver }}.tar.gz ]; then
          wget -q {{ url_redis }}
        fi
        rm -rf redis-{{ redis_ver }}
        tar xzf redis-{{ redis_ver }}.tar.gz
        cd redis-{{ redis_ver }}
        make -j$(nproc)
        make install
        redis-server --version
      args:
        creates: /usr/local/bin/redis-server

    - name: Redis escuchando en la LAN sin auth (D1/D2/D3 intencional)
      copy:
        dest: /etc/redis.conf
        mode: "0644"
        content: |
          bind 0.0.0.0
          port 6379
          # requirepass INTENCIONALMENTE ausente (D1/D2)
          dir /var/lib/redis
          dbfilename dump.rdb
    - name: Directorio de datos Redis
      file:
        path: /var/lib/redis
        state: directory
        owner: nobody
        mode: "0755"
    - name: Redis como servicio simple
      copy:
        dest: /etc/systemd/system/redis.service
        content: |
          [Unit]
          Description=Redis 6.2.6 laboratorio
          After=network.target
          [Service]
          ExecStart=/usr/local/bin/redis-server /etc/redis.conf
          Restart=always
          [Install]
          WantedBy=multi-user.target
    - name: Arrancar Redis
      systemd:
        name: redis
        state: started
        enabled: yes
        daemon_reload: yes

    - name: SNMP communities por defecto (D4 intencional)
      lineinfile:
        path: /etc/snmp/snmpd.conf
        line: "{{ item }}"
      loop:
        - rocommunity public
        - rwcommunity private
    - name: SNMP escuchando en la LAN
      lineinfile:
        path: /etc/snmp/snmpd.conf
        regexp: '^agentAddress'
        line: 'agentAddress udp:161'
    - name: Servicio SNMP activo
      service:
        name: snmpd
        state: started
        enabled: yes

    - name: UFW 3306 solo M1 + 6379/161 abiertos (D3 intencional)
      ufw:
        rule: allow
        port: "3306"
        proto: tcp
        from_ip: "{{ m1_ip }}"
    - name: UFW Redis y SNMP abiertos a la LAN (D3)
      ufw:
        rule: allow
        port: "{{ item }}"
      loop: ["6379", "161"]

    - name: Usuario backup + llave hacia M3
      user:
        name: backup
        shell: /bin/bash
        create_home: yes
        state: present
    - name: Llave SSH del usuario backup
      shell: |
        sudo -u backup ssh-keygen -t ed25519 -N "" -f /home/backup/.ssh/id_ed25519
        sudo -u backup ssh-copy-id -o StrictHostKeyChecking=no backup@10.10.10.13 || true
      args:
        creates: /home/backup/.ssh/id_ed25519
    - name: Directorio de volcados
      file:
        path: /var/backups/mariadb
        state: directory
        mode: "0755"
    - name: Cron volcado + rsync a M3
      cron:
        name: "{{ item.name }}"
        user: "{{ item.user }}"
        minute: "{{ item.min }}"
        hour: "2"
        job: "{{ item.job }}"
      loop:
        - {name: volcado-mariadb, user: root, min: "0",
           job: "mariadb-dump --all-databases --single-transaction | gzip > /var/backups/mariadb/db-$(date +\\%F).sql.gz"}
        - {name: rsync-a-m3, user: backup, min: "15",
           job: "rsync -az /var/backups/mariadb/ backup@10.10.10.13:/srv/storage/backups/"}

    - name: Verificar servicios
      shell: |
        mariadb --version
        redis-cli -h 127.0.0.1 info server | grep redis_version
        ss -tlnp | grep -E '3306|6379|161' || ss -tln | grep -E '3306|6379|161'
      register: verif
      changed_when: false
    - name: Mostrar verificacion
      debug:
        var: verif.stdout_lines

  handlers:
    - name: Reiniciar MariaDB
      service:
        name: mariadb
        state: restarted
