---
# play-m5-client.yml · Estudiante 5, desde su laptop (WSL2):
#   ansible-playbook -i inventories/m5.ini play-m5-client.yml
# Deja: SMBv1 + RDP expuesto + clave debil reutilizada + TightVNC instalado.
# OJO: TightVNC auth None + pausar Windows Update se hacen A MANO (1 min, ver abajo).
- name: M5 estacion Windows 10
  hosts: m5
  gather_facts: no
  vars:
    clave_debil: CAMBIAR_clave_comun_M4_M5   # MISMA que M4 y credenciales.txt (M3)
    lan: 10.10.10.0/24
    # Descarga TightVNC 64-bit ANTES (https://www.tightvnc.com/download.php)
    # y pon el .exe/.msi en ansible/files/. Ejemplo:
    vnc_installer: files/tightvnc-2.8.81-gpl-setup-64bit.exe

  tasks:
    - name: SMBv1 activado (C1 intencional)
      ansible.windows.win_shell: |
        if ((Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol).State -ne "Enabled") {
          Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
        }
      register: smb1

    - name: Administrador local con clave reutilizada (C2 intencional)
      ansible.windows.win_user:
        name: Administrador
        password: "{{ clave_debil }}"
        state: present
        groups:
          - Administradores

    - name: RDP habilitado sin NLA + FW solo M1 (C3 + separacion logica)
      ansible.windows.win_shell: |
        Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
        Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 0
        if (-not (Get-NetFirewallRule -DisplayName "SMB solo M1" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "SMB solo M1" -Direction Inbound `
            -Protocol TCP -LocalPort 445 -RemoteAddress 10.10.10.11 -Action Allow
        }
        if (-not (Get-NetFirewallRule -DisplayName "RDP solo M1" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "RDP solo M1" -Direction Inbound `
            -Protocol TCP -LocalPort 3389 -RemoteAddress 10.10.10.11 -Action Allow
        }
        if (-not (Get-NetFirewallRule -DisplayName "VNC solo M1" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "VNC solo M1" -Direction Inbound `
            -Protocol TCP -LocalPort 5900 -RemoteAddress 10.10.10.11 -Action Allow
        }
        if (-not (Get-NetFirewallRule -DisplayName "SMB resto DROP" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "SMB resto DROP" -Direction Inbound `
            -Protocol TCP -LocalPort 445 -Action Block
        }
      changed_when: false

    - name: Copiar instalador TightVNC
      ansible.windows.win_copy:
        src: "{{ vnc_installer }}"
        dest: C:\Windows\Temp\tightvnc-setup.exe
      when: vnc_installer is file

    - name: Instalar TightVNC Server (C4, silencioso)
      ansible.windows.win_package:
        path: C:\Windows\Temp\tightvnc-setup.exe
        arguments: /S
        state: present
      when: vnc_installer is file

    - name: Recordatorios manuales
      debug:
        msg:
          - "1) TightVNC Server -> Admin: autenticacion None en :5900 (C4, 1 min a mano)."
          - "2) Pausar Windows Update (no parchear MS17-010 hasta Fase 5)."
          - "3) Si se activo SMBv1: REINICIAR y verificar con nmap --script smb-vuln-ms17-010."
