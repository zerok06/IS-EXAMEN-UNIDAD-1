---
# play-m4-windows.yml · Estudiante 4, desde su laptop (WSL2):
#   ansible-playbook -i inventories/m4.ini play-m4-windows.yml
# Deja: DNS standalone + SMBv1 + Spooler + legacy + vulns S1-S5.
# Requiere en la VM: Enable-PSRemoting + WinRM 5985 (ver README-AUTO §1).
- name: M4 Windows heredado
  hosts: m4
  gather_facts: no
  vars:
    clave_debil: CAMBIAR_clave_comun_M4_M5   # MISMA que credenciales.txt (M3) y M5
    lan: 10.10.10.0/24

  tasks:
    - name: Rol DNS instalado
      ansible.windows.win_feature:
        name: DNS
        include_management_tools: yes
        state: present
      register: dnsfeat

    - name: Zona uni.lab + registros A y CNAME
      ansible.windows.win_shell: |
        if (-not (Get-DnsServerZone -Name "uni.lab" -ErrorAction SilentlyContinue)) {
          Add-DnsServerPrimaryZone -Name "uni.lab" -ZoneFile "uni.lab.dns"
        }
        $recs = @(
          @("app","10.10.10.11"), @("db","10.10.10.12"), @("bkp","10.10.10.13"),
          @("srvold","10.10.10.14"), @("pc-est01","10.10.10.15")
        )
        foreach ($r in $recs) {
          if (-not (Get-DnsServerResourceRecord -ZoneName "uni.lab" -Name $r[0] -ErrorAction SilentlyContinue)) {
            Add-DnsServerResourceRecordA -ZoneName "uni.lab" -Name $r[0] -IPv4Address $r[1]
          }
        }
        foreach ($c in @("wp","moodle")) {
          if (-not (Get-DnsServerResourceRecord -ZoneName "uni.lab" -Name $c -ErrorAction SilentlyContinue)) {
            Add-DnsServerResourceRecordCName -ZoneName "uni.lab" -Name $c -HostNameAlias "app.uni.lab."
          }
        }
      changed_when: false

    - name: S4 AXFR abierto a cualquiera (variante intencional)
      ansible.windows.win_shell: |
        Set-DnsServerPrimaryZone -Name "uni.lab" -AllowZoneTransfers Any -NotifyServers $null
        # Verificar con: dig axfr uni.lab @10.10.10.14 (debe volcar la zona)

    - name: SMBv1 activado (S1 intencional)
      ansible.windows.win_shell: |
        if ((Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol).State -ne "Enabled") {
          Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
        }
      register: smb1

    - name: Spooler en automatico (S2 intencional)
      ansible.windows.win_service:
        name: Spooler
        start_mode: auto
        state: started

    - name: Recurso legacy
      ansible.windows.win_shell: |
        if (-not (Test-Path C:\LegacyShare)) { New-Item C:\LegacyShare -ItemType Directory | Out-Null }
        if (-not (Get-SmbShare -Name legacy -ErrorAction SilentlyContinue)) {
          New-SmbShare -Name legacy -Path C:\LegacyShare -FullAccess Administradores
        }
      changed_when: false

    - name: Administrator con clave debil (S3 intencional)
      ansible.windows.win_user:
        name: Administrator
        password: "{{ clave_debil }}"
        state: present
        groups:
          - Administrators

    - name: S5 firma SMB NO requerida (variante intencional)
      ansible.windows.win_shell: |
        Set-SmbServerConfiguration -RequireSecuritySignature $false -Force
        # LLMNR/NBT-NS se dejan activos (defecto) para la demo Responder

    - name: Firewall solo M1 + DNS LAN + DROP resto (separacion logica)
      ansible.windows.win_shell: |
        if (-not (Get-NetFirewallRule -DisplayName "SMB solo M1" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "SMB solo M1" -Direction Inbound `
            -Protocol TCP -LocalPort 445 -RemoteAddress 10.10.10.11 -Action Allow
        }
        if (-not (Get-NetFirewallRule -DisplayName "RDP solo M1" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "RDP solo M1" -Direction Inbound `
            -Protocol TCP -LocalPort 3389 -RemoteAddress 10.10.10.11 -Action Allow
        }
        if (-not (Get-NetFirewallRule -DisplayName "DNS LAN" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule -DisplayName "DNS LAN" -Direction Inbound `
            -Protocol UDP -LocalPort 53 -RemoteAddress {{ lan }} -Action Allow
        }
      changed_when: false

    - name: Aviso reinicio pendiente SMBv1
      debug:
        msg: "Si se activo SMBv1, REINICIA la VM a mano y verifica con: nmap --script smb-protocols 10.10.10.14"
      when: smb1 is changed
